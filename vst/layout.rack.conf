text cx=60 cy=240 label="POTENTIALNOISE: MIX AGAINST THE NOISE" size=1.9 weight=700 align=left color=ece5d3 when=manual_page:0
text cx=60 cy=280 label="A calibrated pink noise reference for the pink-noise mixing method: set a level, solo each track, and raise it" size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:0
text cx=60 cy=312 label="until it is only just audible over the noise. A quick, neutral way to a balanced rough mix." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:0
text cx=62 cy=360 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:0
text cx=84 cy=360 label="Load it as a plugin instrument on its own track. It starts off, so nothing blasts when you add it." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:0
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:0
text cx=84 cy=392 label="The GUIDE page walks you through the whole method, one tap per track." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:0
text cx=62 cy=424 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:0
text cx=84 cy=424 label="It also has test tones, octave bands and a speaker check." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:0
text cx=60 cy=472 label="The full PotentialSuite manual: github.com/PotentialBreakfast/potential-plugins" size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:0
text cx=60 cy=240 label="THE PINK-NOISE METHOD" size=1.9 weight=700 align=left color=ece5d3 when=manual_page:1
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:1
text cx=84 cy=280 label="1. Add PotentialNoise to a track and pick a LEVEL. -14 dB is a good start." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:1
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:1
text cx=84 cy=312 label="2. Tap ON." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:1
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:1
text cx=84 cy=344 label="3. Solo each of your tracks with the noise playing, and raise its level until you can only just hear it over" size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:1
text cx=84 cy=376 label="the noise." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:1
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:1
text cx=84 cy=408 label="4. Switch the noise off. You have a balanced starting point for your mix." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:1
text cx=60 cy=456 label="Pink noise has equal energy in every octave, which is close to how we hear, so nothing ends up too loud or too" size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:1
text cx=60 cy=488 label="quiet for its frequency range." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:1
text cx=60 cy=536 label="GUIDE page: NEXT switches the noise on and names each part of your beat in turn (kick, snare, bass, hats," size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:1
text cx=60 cy=568 label="percussion, main sample, melody, vocals, pads, FX), with what to listen for. Parts you do not have are one tap" size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:1
text cx=60 cy=600 label="to skip. The last tap switches the noise off. DRUMS FIRST or SAMPLE FIRST sets the order." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:1
text cx=60 cy=240 label="CONTROLS" size=1.9 weight=700 align=left color=ece5d3 when=manual_page:2
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:2
text cx=84 cy=280 label="NOISE ON / OFF: fades over about 20 ms, so there are no clicks." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:2
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:2
text cx=84 cy=312 label="LEVEL: -24, -20, -18, -16, -14 or -12 dB RMS. The level is measured: -14 dB means -14 dBFS RMS." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:2
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:2
text cx=84 cy=344 label="SIGNAL: PINK NOISE, TEST TONE, OCTAVE BAND or SPEAKER CHECK." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:2
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:2
text cx=84 cy=376 label="TEST TONE: a steady sine at 1 kHz, 100 Hz, 60 Hz or 40 Hz. 1 kHz at -18 dB is a common reference for gain" size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:2
text cx=84 cy=408 label="staging." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:2
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:2
text cx=84 cy=440 label="OCTAVE BAND: pink noise in one octave, 31 Hz to 16 kHz, to balance the tracks that live in that range." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:2
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:2
text cx=84 cy=472 label="SPEAKER CHECK: left, right, both in phase, both out of phase, 2 seconds each. If the out-of-phase part sounds" size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:2
text cx=84 cy=504 label="centred, one speaker is wired backwards." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:2
text cx=62 cy=536 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:2
text cx=84 cy=536 label="CHANNELS: MONO or STEREO. RANGE: FULL (20 Hz and up) or LIMITED (40 Hz to 16 kHz)." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:2
text cx=62 cy=568 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:2
text cx=84 cy=568 label="RMS and PEAK show what it is sending. CLEAR PEAK resets the peak." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:2
text cx=60 cy=240 label="WITH THE OTHER PLUGINS" size=1.9 weight=700 align=left color=ece5d3 when=manual_page:3
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:3
text cx=84 cy=280 label="Balance first, colour second: use the method on the dry tracks, then add your effect chains." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:3
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:3
text cx=84 cy=312 label="After adding a chain, match its level with the plugin's OUTPUT so the balance you found still holds." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:3
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:3
text cx=84 cy=344 label="A 1 kHz TEST TONE at -18 dB is a quick way to check the level through a chain of effects." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:3
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:3
text cx=84 cy=376 label="Take PotentialNoise off the project, or leave it OFF, when you are done. Its setting is saved with the" size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:3
text cx=84 cy=408 label="project." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:3
text cx=60 cy=240 label="GOOD TO KNOW" size=1.9 weight=700 align=left color=ece5d3 when=manual_page:4
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:4
text cx=84 cy=280 label="Q-Links: ON, LEVEL, SIGNAL, TONE, BAND, CHANNELS, RANGE and CLEAR PEAK." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:4
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:4
text cx=84 cy=312 label="Every setting is saved with your project." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:4
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:4
text cx=84 cy=344 label="Looks: Print Plate, Night Rack or Colour Block, on the SETTINGS page. A new look shows the next time the" size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:4
text cx=84 cy=376 label="plugin loads." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:4
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:4
text cx=84 cy=408 label="It is a starting point, not a finished mix. Use your ears from there." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:4
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:4
text cx=84 cy=440 label="At -12 dB RMS the loudest noise peaks come close to 0 dBFS. -14 dB or lower leaves headroom." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:4
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=ece5d3 when=manual_page:4
text cx=84 cy=472 label="The meter shows the plugin's own output, not your mix." size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:4
text cx=60 cy=520 label="Ideas, bugs and criticism are all welcome: github.com/PotentialBreakfast/mpc-vst-potentialnoise" size=1.45 weight=600 case=none align=left color=aeb7cc when=manual_page:4
